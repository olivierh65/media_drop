media_drop.admin_settings:
  path: '/admin/config/media/media-drop'
  defaults:
    _form: '\Drupal\media_drop\Form\AdminSettingsForm'
    _title: 'Media Drop Settings'
  requirements:
    _permission: 'administer media drop'

media_drop.taxonomy_autocomplete:
  path: '/media-drop/taxonomy-autocomplete/{vocabularies}'
  defaults:
    _controller: '\Drupal\media_drop\Controller\TaxonomyAutocompleteController::autocomplete'
  requirements:
    _access: 'TRUE'
  methods: [GET]

media_drop.depot_list:
  path: '/admin/config/media/media-drop/depots'
  defaults:
    _controller: '\Drupal\media_drop\Controller\DepotController::listDepots'
    _title: 'Depots'
  requirements:
    _permission: 'administer media drop'

media_drop.depot_add:
  path: '/admin/config/media/media-drop/depots/add'
  defaults:
    _form: '\Drupal\media_drop\Form\DepotForm'
    _title: 'Add a depot'
  requirements:
    _permission: 'administer media drop'

media_drop.depot_edit:
  path: '/admin/config/media/media-drop/depots/{depot_id}/edit'
  defaults:
    _form: '\Drupal\media_drop\Form\DepotForm'
    _title: 'Edit a depot'
  requirements:
    _permission: 'administer media drop'

media_drop.depot_delete:
  path: '/admin/config/media/media-drop/depots/{depot_id}/delete'
  defaults:
    _form: '\Drupal\media_drop\Form\DepotDeleteForm'
    _title: 'Delete a depot'
  requirements:
    _permission: 'administer media drop'

media_drop.mime_mapping:
  path: '/admin/config/media/media-drop/mime-mapping'
  defaults:
    _form: '\Drupal\media_drop\Form\MimeMappingForm'
    _title: 'MIME type mapping'
  requirements:
    _permission: 'administer media drop'
media_drop.ajax_check_filefield_paths:
  path: '/admin/config/media/media-drop/ajax/check-filefield-paths'
  defaults:
    _controller: '\Drupal\media_drop\Controller\DepotController::checkFileFieldPathsAjax'
  requirements:
    _permission: 'administer media drop'
    _access: 'TRUE'
  methods: [POST]
media_drop.manage_media:
  path: '/admin/config/media/media-drop/manage'
  defaults:
    _controller: '\Drupal\media_drop\Controller\ManageMediaController::managePage'
    _title: 'Manage media'
  requirements:
    _permission: 'administer media drop'

media_drop.create_manage_view:
  path: '/admin/config/media/media-drop/create-manage-view'
  defaults:
    _controller: '\Drupal\media_drop\Controller\ManageMediaController::createView'
    _title: 'Create view'
  requirements:
    _permission: 'administer media drop'

media_drop.upload:
  path: '/media-drop/{depot_token}'
  defaults:
    _controller: '\Drupal\media_drop\Controller\UploadController::uploadPage'
    _title: 'Drop media'
  requirements:
    _access: 'TRUE'

media_drop.ajax_upload:
  path: '/media-drop/{depot_token}/ajax-upload'
  defaults:
    _controller: '\Drupal\media_drop\Controller\UploadController::ajaxUpload'
  requirements:
    _custom_access: '\Drupal\media_drop\Controller\UploadController::checkUploadAccess'
  options:
    no_cache: TRUE

media_drop.ajax_create_folder:
  path: '/media-drop/{depot_token}/create-folder'
  defaults:
    _controller: '\Drupal\media_drop\Controller\UploadController::createFolder'
  requirements:
    _permission: 'create depot folders'
  options:
    no_cache: TRUE

media_drop.ajax_list_media:
  path: '/media-drop/{depot_token}/list-media'
  defaults:
    _controller: '\Drupal\media_drop\Controller\UploadController::listMedia'
  requirements:
    _permission: 'view own uploaded media'
  options:
    no_cache: TRUE

media_drop.ajax_delete_media:
  path: '/media-drop/{depot_token}/delete-media/{media_id}'
  defaults:
    _controller: '\Drupal\media_drop\Controller\UploadController::deleteMedia'
  requirements:
    _permission: 'delete own uploaded media'
  methods: [DELETE, POST]
  options:
    no_cache: TRUE

media_drop.ajax_list_folders:
  path: '/media-drop/{depot_token}/list-folders'
  defaults:
    _controller: '\Drupal\media_drop\Controller\UploadController::listFolders'
    _title: 'List Folders'
  requirements:
    _permission: 'upload media to depots'
  options:
    parameters:
      depot_token:
        type: string

media_drop.ajax_trigger_notification:
  path: '/media-drop/{depot_token}/trigger-notification'
  defaults:
    _controller: '\Drupal\media_drop\Controller\UploadController::triggerNotification'
    _title: 'Trigger Notification'
  requirements:
    _permission: 'upload media to depots'
  options:
    no_cache: TRUE
  methods: [POST]

media_drop.ajax_check_duplicate:
  path: '/media-drop/{depot_token}/check-duplicate'
  defaults:
    _controller: '\Drupal\media_drop\Controller\UploadController::checkDuplicate'
    _title: 'Check Duplicate'
  requirements:
    _permission: 'upload media to depots'
  options:
    no_cache: TRUE
  methods: [POST]

draggable_flexgrid.save_order:
  path: '/media-drop/draggable-flexgrid/save-order'
  defaults:
    _controller: '\Drupal\media_drop\Controller\DraggableFlexGridController::saveOrder'
    _title: 'Save order'
  requirements:
    _permission: 'upload media to depots'
  methods: [POST]
  options:
    no_cache: TRUE
